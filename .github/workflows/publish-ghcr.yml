name: Publish GHCR image

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: Add-on version from rethink/config.yaml (without the v prefix)
                required: true
                type: string

permissions:
    contents: read
    packages: write

concurrency:
    group: ghcr-${{ github.ref }}
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/sdrgonlee/rethink-ha-addon

jobs:
    prepare:
        name: Validate release version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Check out release source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Match tag or input to config.yaml
              id: version
              shell: bash
              run: |
                  set -euo pipefail
                  config_version="$(sed -nE "s/^version: ['\"]([^'\"]+)['\"]$/\1/p" rethink/config.yaml)"
                  if [[ -z "${config_version}" ]]; then
                    echo "Unable to read version from rethink/config.yaml" >&2
                    exit 1
                  fi

                  if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
                    release_version="${GITHUB_REF_NAME#v}"
                  else
                    release_version="${{ inputs.version }}"
                  fi

                  if [[ "${release_version}" != "${config_version}" ]]; then
                    echo "Requested version ${release_version} does not match config.yaml ${config_version}" >&2
                    exit 1
                  fi

                  if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                    echo "Invalid container tag version: ${release_version}" >&2
                    exit 1
                  fi

                  echo "version=${release_version}" >> "${GITHUB_OUTPUT}"

    build:
        name: Build ${{ matrix.arch }}
        needs: prepare
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                    - arch: aarch64
                      platform: linux/arm64
        steps:
            - name: Check out release source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to GHCR
              uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push ${{ matrix.platform }}
              uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
              with:
                  context: ./rethink
                  file: ./rethink/Dockerfile
                  platforms: ${{ matrix.platform }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
                  build-args: |
                      BUILD_VERSION=${{ needs.prepare.outputs.version }}
                      BUILD_ARCH=${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
                  cache-from: type=gha,scope=${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
                  provenance: false
                  sbom: false

    manifest:
        name: Publish multi-arch manifest
        needs:
            - prepare
            - build
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to GHCR
              uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create versioned multi-arch manifest
              shell: bash
              run: |
                  set -euo pipefail
                  version="${{ needs.prepare.outputs.version }}"
                  docker buildx imagetools create \
                    --tag "${IMAGE}:${version}" \
                    "${IMAGE}:${version}-amd64" \
                    "${IMAGE}:${version}-aarch64"

            - name: Verify published platforms
              shell: bash
              run: |
                  set -euo pipefail
                  image="${IMAGE}:${{ needs.prepare.outputs.version }}"
                  inspection="$(docker buildx imagetools inspect "${image}")"
                  printf '%s\n' "${inspection}"
                  grep -q 'linux/amd64' <<< "${inspection}"
                  grep -q 'linux/arm64' <<< "${inspection}"
